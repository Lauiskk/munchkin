# golangci-lint v2 — Munchkin
# Seleção voltada para um serviço financeiro: erro não pode sumir em silêncio,
# recurso não pode vazar, e contexto tem que ser propagado.
version: "2"

run:
  timeout: 5m
  tests: true

# misspell fica de fora: só tem dicionário de inglês, e a documentação deste
# projeto é em português — ele acusaria "problemas" como erro de "problems".
linters:
  default: standard   # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose       # resposta HTTP fechada
    - errorlint       # comparação de erro por errors.Is/As, não por ==
    - gocritic
    - gosec           # varredura de segurança
    - nilerr          # return nil quando err != nil
    - noctx           # requisição HTTP sem context
    - revive
    - rowserrcheck    # rows.Err() após iterar
    - sqlclosecheck   # rows/stmt fechados
    - unconvert
  settings:
    errcheck:
      check-type-assertions: true
      # check-blank fica desligado: ele reprova `v, _ := x.(T)` e `_ = f()`,
      # que são a forma idiomática de dizer "considerei e ignoro". O que
      # importa — chamada com erro totalmente ignorado — o padrão já pega.
      check-blank: false
    gosec:
      excludes:
        - G115         # conversão int → int; tratamos overflow explicitamente no money
    revive:
      rules:
        - name: exported
          disabled: true   # documentação vive nos docs, não em comentário por símbolo
  exclusions:
    presets:
      - common-false-positives
    rules:
      - path: _test\.go$
        # bodyclose não enxerga fechamento via t.Cleanup, e httptest.NewRequest
        # sem context é o idioma normal de teste.
        linters: [gosec, errcheck, bodyclose, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Lauiskk/munchkin
