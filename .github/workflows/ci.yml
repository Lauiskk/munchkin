name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.1"

# Os jobs são independentes de propósito: um gate que falha não pode fazer
# outro aparecer como "skipped" e passar despercebido.
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: make build

  gates:
    name: gates (critérios eliminatórios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: make gates

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      # Binário pré-compilado da release, em vez de `go install`.
      #
      # Compilar o golangci-lint do fonte baixa cerca de cem módulos a cada
      # execução, e uma falha transitória de rede em qualquer um deles reprova o
      # job por motivo que não tem relação com o código — foi o que aconteceu.
      # A verificação do somatório mantém a integridade do que é baixado.
      - name: instala golangci-lint
        env:
          VERSION: "2.13.2"
        run: |
          set -euo pipefail
          arquivo="golangci-lint-${VERSION}-linux-amd64"
          base="https://github.com/golangci/golangci-lint/releases/download/v${VERSION}"
          curl -sSfL --retry 3 --retry-delay 2 -o "$arquivo.tar.gz" "$base/$arquivo.tar.gz"
          curl -sSfL --retry 3 --retry-delay 2 -o checksums.txt "$base/golangci-lint-${VERSION}-checksums.txt"
          grep " $arquivo.tar.gz\$" checksums.txt | sha256sum -c -
          tar -xzf "$arquivo.tar.gz"
          sudo install "$arquivo/golangci-lint" /usr/local/bin/
          golangci-lint version
      - run: make lint

  test:
    name: testes unitários (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: make test-race

  secrets:
    name: nenhum segredo versionado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: chave privada no repositório
        run: |
          if git grep -lE 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY' -- . ; then
            echo "✗ chave privada versionada"; exit 1
          fi
          echo "✓ nenhuma chave privada"
      - name: .env versionado
        run: |
          if git ls-files | grep -E '^\.env' | grep -vx '\.env\.example' ; then
            echo "✗ arquivo .env versionado"; exit 1
          fi
          echo "✓ nenhum .env versionado"
