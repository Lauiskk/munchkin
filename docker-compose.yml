# Ambiente local do Munchkin.
#
# `docker compose up --build` sobe tudo que a aplicação precisa. Os serviços de
# observabilidade ficam no profile `observability` para que o ambiente padrão
# continue leve — quem avalia não deveria precisar de uma máquina grande.
#
# As portas evitam as faixas usuais (5432, 8080 do Keycloak, 4566) porque é
# comum já haver outro stack ocupando-as na máquina de quem for rodar.

name: munchkin

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: munchkin_keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # Emissor fixo, independente de por onde o Keycloak for alcançado. Sem
      # isto, o iss do token muda conforme o cliente use 127.0.0.1, localhost
      # ou o nome do serviço na rede do compose — e a validação de emissor
      # passaria a falhar dependendo de quem pede o token.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
    volumes:
      # O realm é importado a cada subida, então o ambiente é sempre o mesmo —
      # é o que torna a reprodução a partir de um checkout limpo confiável.
      - ./deploy/keycloak/realm-munchkin.json:/opt/keycloak/data/import/realm-munchkin.json:ro
    ports:
      # Preso ao loopback: um IdP de desenvolvimento não deve ficar exposto na rede.
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # As imagens recentes do Keycloak não trazem curl nem wget. A sonda usa o
      # /dev/tcp do próprio bash, que existe na imagem.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  postgres:
    image: postgres:18.6-alpine
    container_name: munchkin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_OWNER_USER:-munchkin_owner}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-local-only-owner}
      POSTGRES_DB: ${DB_NAME:-munchkin}
      MUNCHKIN_APP_PASSWORD: ${DB_PASSWORD:-local-only-app}
    volumes:
      # O PostgreSQL 18 mudou a convenção: o volume monta em /var/lib/postgresql
      # e os dados ficam num subdiretório por versão maior, o que permite
      # pg_upgrade sem esbarrar na fronteira do ponto de montagem. Montar em
      # .../data, como se fazia até a 17, faz a imagem recusar a subida.
      - postgres_data:/var/lib/postgresql
      - ./deploy/postgres/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    ports:
      # Publicado no loopback e fora da faixa usual: é comum já haver outro
      # Postgres na 5432 da máquina de quem for rodar.
      - "127.0.0.1:${DB_HOST_PORT:-5440}:5432"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_OWNER_USER:-munchkin_owner} -d ${DB_NAME:-munchkin}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  localstack:
    image: localstack/localstack:4.9
    container_name: munchkin_localstack
    restart: unless-stopped
    environment:
      SERVICES: sqs
      DEBUG: "0"
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      # O LocalStack aceita qualquer credencial. Fixamos as mesmas que a
      # aplicação usa para que uma divergência apareça como erro de assinatura,
      # e não como "fila não encontrada" mais adiante.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local-only-access-key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local-only-secret-key}
    volumes:
      # ready.d roda depois que o serviço está de pé, que é quando criar fila
      # funciona.
      - ./deploy/localstack/10-queues.sh:/etc/localstack/init/ready.d/10-queues.sh:ro
    ports:
      # Fora da 4566 usual, pela mesma razão das demais.
      - "127.0.0.1:${LOCALSTACK_HOST_PORT:-4576}:4566"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # A fila de saída é a última que o script cria: se ela existe, o
      # provisionamento inteiro terminou. Perguntar só pelo serviço deixaria a
      # aplicação subir antes das filas existirem.
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-events.fifo || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  migrate:
    # Mesma imagem da aplicação: as migrations são embarcadas no binário, então
    # não há como aplicar uma versão de schema que não corresponda ao código
    # que vai usá-la.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: munchkin_migrate
    command: ["migrate", "up"]
    restart: "no"
    environment:
      LOG_FORMAT: json
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-munchkin}
      # Credenciais do DONO do schema. Só este serviço as recebe — a aplicação
      # roda com um papel que não pode criar nem alterar estrutura, e é isso
      # que torna o REVOKE sobre o ledger efetivo.
      DB_USER: ${DB_OWNER_USER:-munchkin_owner}
      DB_PASSWORD: ${DB_OWNER_PASSWORD:-local-only-owner}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=16M

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: munchkin_api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      HTTP_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      # O emissor é o endereço PÚBLICO, porque é ele que o Keycloak grava na
      # claim `iss` do token. A descoberta usa o endereço INTERNO, porque é
      # por ele que a aplicação alcança o Keycloak dentro desta rede. Confundir
      # os dois é a causa clássica de "funciona na minha máquina e quebra no
      # container": o token é válido, mas o emissor não confere.
      AUTH_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/munchkin
      AUTH_DISCOVERY_URL: http://keycloak:8080/realms/munchkin/.well-known/openid-configuration
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-munchkin-api}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-munchkin}
      DB_USER: ${DB_USER:-munchkin_app}
      DB_PASSWORD: ${DB_PASSWORD:-local-only-app}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Endereço INTERNO do LocalStack. O endereço publicado no host serve para
      # inspecionar as filas de fora, não para a aplicação.
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local-only-access-key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local-only-secret-key}
      AWS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      AWS_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      AWS_TRANSACTIONS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
    ports:
      # API_HOST_PORT é a porta na SUA máquina; HTTP_PORT acima é a porta
      # dentro do container, que é sempre 8080. Usar o mesmo nome para as duas
      # coisas confunde quem precisa mudar só uma delas.
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # A aplicação só sobe depois de o schema estar na versão certa. Sem isto,
      # a primeira requisição encontraria tabela inexistente e o erro
      # apareceria como defeito da aplicação.
      migrate:
        condition: service_completed_successfully
      # As filas precisam existir antes: o publicador da outbox falharia na
      # primeira rodada, e a prontidão do SQS recusaria a aplicação.
      localstack:
        condition: service_healthy
    # A aplicação não escreve em disco: tudo que ela produz sai no stdout.
    # Sistema de arquivos somente leitura e sem capacidade nenhuma reduzem o
    # que um comprometimento consegue fazer a partir daqui.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=16M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  postgres_data:
